name: Build Bravest Browser Releases

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-desktop-app:
    name: Build Bravest Desktop Browser
    runs-on: windows-latest

    steps:
      - name: Checkout Bravest Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Bravest Executable
        run: npx electron-builder --win

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bravest-windows-installer
          path: dist/*.exe
